<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager | React LocalStorage</title>
    
    <!-- Tailwind CSS (Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (Core) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (JSX Compilation in Browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Custom Styles -->
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.95); 
            border: 1px solid #e5e7eb; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            backdrop-filter: blur(4px);
        }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- COMPONENTS ---

        // 1. Header Component
        const Header = () => (
            <header className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg">
                <div className="container mx-auto px-6 py-4 flex justify-between items-center">
                    <div className="flex items-center space-x-3">
                        <i className="fa-solid fa-address-book text-2xl"></i>
                        <div>
                            <h1 className="text-xl font-bold tracking-wide">ContactManager</h1>
                        </div>
                    </div>
                    <div className="text-indigo-100 text-sm font-medium bg-white/20 px-3 py-1 rounded-full">
                        Client-Side Mode
                    </div>
                </div>
            </header>
        );

        // 2. Alert Component
        const Alert = ({ type, message }) => {
            if (!message) return null;
            const styles = type === 'error' 
                ? 'bg-red-50 text-red-700 border-red-200' 
                : 'bg-green-50 text-green-700 border-green-200';
            const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
            
            return (
                <div className={`p-4 mb-4 rounded-lg border ${styles} flex items-center shadow-sm fade-in`}>
                    <i className={`mr-2 fa-solid ${icon}`}></i>
                    {message}
                </div>
            );
        };

        // 3. Contact Form Component
        const ContactForm = ({ onAdd }) => {
            const [formData, setFormData] = useState({ name: '', email: '', phone: '', message: '' });
            const [errors, setErrors] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);

            // Validation Logic
            const validate = (name, value) => {
                let error = '';
                if (name === 'email' && value && !/.+@.+\..+/.test(value)) error = 'Invalid email format';
                if (name === 'phone' && value && value.length < 10) error = 'Phone number too short';
                return error;
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
                
                const error = validate(name, value);
                setErrors(prev => ({ ...prev, [name]: error }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                
                // Form Validation
                if (!formData.name || !formData.email || !formData.phone) {
                    setErrors({ form: 'Please fill in all required fields.' });
                    setIsSubmitting(false);
                    return;
                }
                if (errors.email || errors.phone) {
                    setIsSubmitting(false);
                    return;
                }

                // Simulate slight network delay for realism
                setTimeout(() => {
                    onAdd(formData);
                    setFormData({ name: '', email: '', phone: '', message: '' });
                    setIsSubmitting(false);
                }, 400);
            };

            const isValid = formData.name && formData.email && formData.phone && !errors.email && !errors.phone;

            return (
                <div className="glass-panel rounded-xl p-6 md:p-8 h-fit sticky top-6">
                    <h2 className="text-xl font-bold text-gray-800 mb-6 flex items-center border-b pb-4">
                        <div className="bg-indigo-100 p-2 rounded-lg mr-3 text-indigo-600">
                             <i className="fa-solid fa-user-plus"></i>
                        </div>
                        Add New Contact
                    </h2>
                    
                    <form onSubmit={handleSubmit} className="space-y-4">
                        {/* Name */}
                        <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-1">Full Name <span className="text-red-500">*</span></label>
                            <div className="relative group">
                                <i className="fa-solid fa-user absolute left-3 top-3.5 text-gray-400 group-focus-within:text-indigo-500 transition"></i>
                                <input 
                                    type="text" 
                                    name="name" 
                                    value={formData.name}
                                    onChange={handleChange}
                                    placeholder="e.g. John Doe"
                                    className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50 focus:bg-white"
                                />
                            </div>
                        </div>

                        {/* Email */}
                        <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-1">Email Address <span className="text-red-500">*</span></label>
                            <div className="relative group">
                                <i className="fa-solid fa-envelope absolute left-3 top-3.5 text-gray-400 group-focus-within:text-indigo-500 transition"></i>
                                <input 
                                    type="email" 
                                    name="email"
                                    value={formData.email}
                                    onChange={handleChange} 
                                    placeholder="john@example.com"
                                    className={`w-full pl-10 pr-4 py-3 border rounded-lg focus:ring-2 outline-none transition bg-gray-50 focus:bg-white ${errors.email ? 'border-red-300 focus:ring-red-200' : 'border-gray-300 focus:ring-indigo-500'}`}
                                />
                            </div>
                            {errors.email && <p className="text-xs text-red-500 mt-1 font-medium">{errors.email}</p>}
                        </div>

                        {/* Phone */}
                        <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-1">Phone Number <span className="text-red-500">*</span></label>
                            <div className="relative group">
                                <i className="fa-solid fa-phone absolute left-3 top-3.5 text-gray-400 group-focus-within:text-indigo-500 transition"></i>
                                <input 
                                    type="tel" 
                                    name="phone"
                                    value={formData.phone}
                                    onChange={handleChange}
                                    placeholder="(555) 123-4567"
                                    className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50 focus:bg-white"
                                />
                            </div>
                        </div>

                        {/* Message */}
                        <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-1">Notes (Optional)</label>
                            <textarea 
                                name="message"
                                value={formData.message}
                                onChange={handleChange}
                                rows="3"
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50 focus:bg-white"
                                placeholder="Any additional details..."
                            ></textarea>
                        </div>

                        {/* Submit Button */}
                        <button 
                            type="submit" 
                            disabled={!isValid || isSubmitting}
                            className={`w-full py-3 rounded-lg font-bold text-white transition-all shadow-md transform active:scale-95 flex justify-center items-center ${!isValid || isSubmitting ? 'bg-gray-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 hover:shadow-lg'}`}
                        >
                            {isSubmitting ? (
                                <><i className="fa-solid fa-circle-notch fa-spin mr-2"></i> Saving...</>
                            ) : (
                                <><i className="fa-solid fa-paper-plane mr-2"></i> Save Contact</>
                            )}
                        </button>
                    </form>
                </div>
            );
        };

        // 4. Contact Card Component
        const ContactCard = ({ contact, onDelete }) => (
            <div className="glass-panel p-5 rounded-xl hover:shadow-lg transition duration-300 border-l-4 border-indigo-500 relative group fade-in">
                <button 
                    onClick={() => onDelete(contact.id)}
                    className="absolute top-4 right-4 text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition opacity-0 group-hover:opacity-100"
                    title="Delete Contact"
                >
                    <i className="fa-solid fa-trash"></i>
                </button>

                <div className="flex items-start mb-4">
                    <div className="w-14 h-14 rounded-full bg-gradient-to-br from-indigo-100 to-purple-100 flex items-center justify-center text-indigo-700 text-xl font-bold mr-4 shadow-inner border border-white">
                        {contact.name.charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <h3 className="text-lg font-bold text-gray-800">{contact.name}</h3>
                        <p className="text-xs text-gray-500 font-medium bg-gray-100 inline-block px-2 py-0.5 rounded mt-1">
                            Added: {new Date(contact.createdAt).toLocaleDateString()}
                        </p>
                    </div>
                </div>

                <div className="space-y-3 mt-2">
                    <div className="flex items-center text-gray-700 text-sm group-hover:text-indigo-600 transition-colors">
                        <div className="w-8 flex justify-center mr-1">
                            <i className="fa-solid fa-envelope text-indigo-400"></i>
                        </div>
                        {contact.email}
                    </div>
                    <div className="flex items-center text-gray-700 text-sm group-hover:text-indigo-600 transition-colors">
                        <div className="w-8 flex justify-center mr-1">
                            <i className="fa-solid fa-phone text-indigo-400"></i>
                        </div>
                        {contact.phone}
                    </div>
                    {contact.message && (
                        <div className="mt-4 pt-3 border-t border-gray-100 text-sm text-gray-500 italic bg-gray-50/50 p-2 rounded">
                            "{contact.message}"
                        </div>
                    )}
                </div>
            </div>
        );

        // 5. Main App Component
        const App = () => {
            const [contacts, setContacts] = useState([]);
            const [status, setStatus] = useState({ type: '', message: '' });

            // Load from LocalStorage on mount
            useEffect(() => {
                const savedContacts = localStorage.getItem('my_contacts');
                if (savedContacts) {
                    setContacts(JSON.parse(savedContacts));
                }
            }, []);

            // Save to LocalStorage whenever contacts change
            useEffect(() => {
                localStorage.setItem('my_contacts', JSON.stringify(contacts));
            }, [contacts]);

            const addContact = (formData) => {
                const newContact = {
                    id: Date.now().toString(), // Use timestamp as ID
                    ...formData,
                    createdAt: new Date().toISOString()
                };
                
                setContacts([newContact, ...contacts]); // Add to top
                setStatus({ type: 'success', message: 'Contact saved successfully!' });
                
                setTimeout(() => setStatus({ type: '', message: '' }), 3000);
            };

            const deleteContact = (id) => {
                if(!confirm('Are you sure you want to delete this contact permanently?')) return;
                
                setContacts(contacts.filter(c => c.id !== id));
                setStatus({ type: 'error', message: 'Contact deleted.' });
                setTimeout(() => setStatus({ type: '', message: '' }), 2000);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <Header />

                    <main className="flex-grow container mx-auto px-4 py-8">
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            
                            {/* Left Column: Form */}
                            <div className="lg:col-span-1">
                                <Alert type={status.type} message={status.message} />
                                <ContactForm onAdd={addContact} />
                            </div>

                            {/* Right Column: List */}
                            <div className="lg:col-span-2">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800 flex items-center">
                                        Your Contacts 
                                        <span className="ml-3 bg-indigo-100 text-indigo-700 text-sm font-bold px-3 py-1 rounded-full">
                                            {contacts.length}
                                        </span>
                                    </h2>
                                </div>

                                {contacts.length === 0 ? (
                                    <div className="text-center py-24 bg-white rounded-xl border-2 border-dashed border-gray-300 fade-in">
                                        <div className="bg-indigo-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <i className="fa-regular fa-folder-open text-4xl text-indigo-300"></i>
                                        </div>
                                        <h3 className="text-lg font-medium text-gray-900">No contacts yet</h3>
                                        <p className="text-gray-500 mt-1">Fill out the form to add your first contact.</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        {contacts.map(contact => (
                                            <ContactCard 
                                                key={contact.id} 
                                                contact={contact} 
                                                onDelete={deleteContact} 
                                            />
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="bg-white border-t border-gray-200 py-8 mt-8">
                        <div className="container mx-auto px-4 text-center">
                            <p className="text-gray-500 text-sm">&copy; {new Date().getFullYear()} Contact Management System.</p>
                            <p className="text-gray-400 text-xs mt-2">Data stored in browser LocalStorage</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
